<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a7cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AllDrop">
<title>AllDrop</title>
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top">
  <div class="brand">
    <img src="icon-64.png" alt="" width="28" height="28">
    <span>AllDrop</span>
  </div>
  <div class="top-actions">
    <button id="meChip" class="chip" type="button" title=""><span class="dot"></span><span id="meName">…</span></button>
    <select id="langSel" class="lang-sel" aria-label="Language" title="Language">
      <option value="en">EN</option>
      <option value="tr">TR</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="fr">FR</option>
      <option value="ar">AR</option>
      <option value="zh">中文</option>
    </select>
    <button id="settingsBtn" class="icon-btn hidden" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.4-2.5c.04-.33.06-.66.06-1s-.02-.67-.06-1l2.1-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.9 2h-4a.5.5 0 0 0-.5.42l-.37 2.65c-.63.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.5.5 0 0 0 .12.64L4.4 11c-.04.33-.06.66-.06 1s.02.67.06 1l-2.1 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.3.6.22l2.49-1c.53.4 1.1.74 1.73 1l.37 2.65c.05.24.26.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.2-.6 1.73-1l2.49 1c.22.08.48 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64L19.4 13z"/></svg>
    </button>
  </div>
</div>

<div id="offline" class="banner hidden"></div>

<div id="main">
  <section id="stagedBox" class="card staged hidden"></section>
  <section id="pickedBox" class="card staged hidden"></section>

  <section class="card devices-card">
    <div class="card-head">
      <h2 id="tDevices"></h2>
      <button id="scanBtn" class="link-btn hidden" type="button"></button>
    </div>
    <div id="devices" class="devices"></div>
    <div id="empty" class="empty hidden">
      <div class="radar"><span></span><span></span><span></span></div>
      <p id="emptyText"></p>
    </div>
    <p id="hint" class="hint"></p>
  </section>

  <section id="transfersBox" class="card hidden">
    <div class="card-head"><h2 id="tTransfers"></h2></div>
    <div id="transfers"></div>
  </section>

  <section id="inboxBox" class="card hidden">
    <div class="card-head">
      <h2 id="tInbox"></h2>
      <div>
        <a id="zipAll" class="link-btn" href="/api/inbox/zip"></a>
        <button id="clearInbox" class="link-btn" type="button"></button>
      </div>
    </div>
    <div id="inbox"></div>
  </section>

  <section id="joinBox" class="card join hidden">
    <div class="join-qr"><img id="qrImg" alt="QR" width="200" height="200"></div>
    <div class="join-text">
      <h2 id="tJoin"></h2>
      <p id="tJoinSub"></p>
      <ol>
        <li id="tJoin1"></li>
        <li id="tJoin2"></li>
        <li id="tJoin3"></li>
      </ol>
      <div class="url-row"><code id="joinUrl"></code> <button id="nextUrl" class="link-btn hidden" type="button"></button></div>
    </div>
  </section>

  <section id="historyBox" class="card hidden">
    <div class="card-head">
      <h2 id="tHistory"></h2>
      <button id="openFolder" class="link-btn" type="button"></button>
    </div>
    <div id="history"></div>
  </section>

  <p class="foot" id="foot"></p>
  <p class="foot"><a id="getApps" class="get-apps" href="https://pilotmemorable.github.io/alldrop/" target="_blank" rel="noopener"></a></p>
</div>

<div id="bar">
  <button id="pickFiles" class="btn primary" type="button"></button>
  <button id="pickDir" class="btn hidden" type="button"></button>
</div>

<div id="dropOverlay" class="hidden"><div id="dropText"></div></div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>

<div id="toast" class="toast hidden"></div>

<input type="file" id="filePick" multiple class="file-input">
<input type="file" id="dirPick" multiple webkitdirectory directory class="file-input">

<script src="app.js"></script>
</body>
</html>
