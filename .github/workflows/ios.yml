# Builds the iPhone/iPad app. Without secrets it only checks that the app
# compiles (simulator). With the secrets below it signs the app and uploads
# it to App Store Connect (TestFlight), ready to submit for review.
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID (Users and Access > Integrations, role "App Manager")
#   ASC_ISSUER_ID      Issuer ID shown on the same page
#   IOS_BUNDLE_ID      e.g. com.yourname.alldrop (default com.alldrop.app)
# Repository secret (Settings > Secrets and variables > Actions > Secrets):
#   ASC_KEY_P8         full contents of the downloaded AuthKey_XXXX.p8 file
# (The three IDs may also be stored as secrets instead of variables.)
name: iOS app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0). Leave empty for 1.0.0.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    # App Store uploads must be built with Xcode 26 / the iOS 26 SDK (macOS 26 runner)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.alldrop.app' }}
      RELEASE_TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Tools
        run: xcodebuild -version && go version
      - name: Build the Go engine as an iOS framework
        run: |
          set -o pipefail
          mkdir -p ios/Frameworks
          bash ./ios/build-engine.sh 2>&1 | tee "$RUNNER_TEMP/engine.log"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Compile check (simulator, unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project AllDrop.xcodeproj -scheme AllDrop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -60 "$RUNNER_TEMP/build.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/build.log"
      - name: Archive and upload to App Store Connect
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID || secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Signing secrets not set: skipping App Store upload."; exit 0
          fi
          set -o pipefail
          cd ios
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          V="${RELEASE_TAG#v}"; [ -n "$V" ] || V=1.0.0
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project AllDrop.xcodeproj -scheme AllDrop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AllDrop.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/archive.log"
          # The archive is unsigned (a development profile would need a registered device);
          # the export step signs it for App Store distribution with cloud-managed signing.
          sed "s/TEAM_ID/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AllDrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH > "$RUNNER_TEMP/export.log" 2>&1 || { tail -60 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/export.log"
          echo "Uploaded to App Store Connect. Open TestFlight / App Store Connect to submit for review."
      - name: Show errors as annotations
        if: failure()
        run: |
          for f in engine build archive export; do
            L="$RUNNER_TEMP/$f.log"; [ -f "$L" ] || continue
            grep -E "error|Error|fatal|FAILED|failed" "$L" | grep -v "^[[:space:]]*$" | tail -9 | while IFS= read -r line; do
              echo "::error title=$f::$(printf '%s' "$line" | cut -c1-400)"
            done
          done
