# Builds the iPhone/iPad app. Without secrets it only checks that the app
# compiles (simulator). With the secrets below it signs the app and uploads
# it to App Store Connect (TestFlight), ready to submit for review.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com > Membership)
#   ASC_KEY_ID         App Store Connect API key ID (Users and Access > Integrations > Keys, role "App Manager")
#   ASC_ISSUER_ID      Issuer ID shown on the same page
#   ASC_KEY_P8         contents of the downloaded AuthKey_XXXX.p8 file
# Repository variable (optional):
#   IOS_BUNDLE_ID      e.g. com.yourname.alldrop (default com.alldrop.app)
name: iOS app

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.alldrop.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build the Go engine as an iOS framework
        run: mkdir -p ios/Frameworks && bash ./ios/build-engine.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Compile check (simulator, unsigned)
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project AllDrop.xcodeproj -scheme AllDrop -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Archive and upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Signing secrets not set: skipping App Store upload."; exit 0
          fi
          set -o pipefail
          cd ios
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          V="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = tag ] || V=1.0.0
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project AllDrop.xcodeproj -scheme AllDrop -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AllDrop.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            $AUTH archive | tail -30
          sed "s/TEAM_ID/$TEAM_ID/" ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AllDrop.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -30
          echo "Uploaded to App Store Connect. Open TestFlight / App Store Connect to submit for review."
